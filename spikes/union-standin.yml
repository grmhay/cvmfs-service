---
# nix_union_store in union Mode against a stand-in Lower Store, on a throwaway
# host with no Repository. Build the stand-in first: see spikes/union-standin.sh.
- name: Union Store over a stand-in Lower Store
  hosts: all
  vars:
    cvmfs_nix_mode: union
    nix_lower_store: /srv/lower/nix
    # A stand-in has no Profiles, so no PATH target to check (#28). Its
    # profile.d entry points at the role's default Channel, stable, which
    # this inventory-less run cannot know: re-run the client role for the host
    # from the NetBox inventory before it reads the Repository.
    nix_path_target_check: false
  roles:
    - nix_union_store
