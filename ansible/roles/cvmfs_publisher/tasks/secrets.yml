---
# Decrypts publisher.enc.yaml on the control node (Semaphore on pi5, or any
# host with the shared age key; ADR 0005). The ciphertext ships inside the
# collection, so a checkout and a vendored copy read the same file.
- name: Publisher secrets file is there
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.stat:
    path: "{{ publisher_secrets_file }}"
  register: _secrets_file

- name: Fail if the publisher secrets file is missing
  ansible.builtin.assert:
    that: _secrets_file.stat.exists
    fail_msg: >-
      {{ publisher_secrets_file }} not found. It ships in the collection at
      secrets/publisher.enc.yaml (server/minio/RUNBOOK.md §2 creates it).
  run_once: true

# Semaphore runs each template with its own HOME, so sops's default
# $HOME/.config/sops/age/keys.txt misses the key: point at it explicitly.
- name: Decrypt publisher secrets (control node)
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command: "sops --decrypt {{ publisher_secrets_file }}"
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
  register: _secrets_raw
  changed_when: false
  no_log: true

- name: Parse secrets
  ansible.builtin.set_fact:
    publisher_secrets: "{{ _secrets_raw.stdout | from_yaml }}"
  no_log: true
