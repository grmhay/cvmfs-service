---
# Early part of the Publisher, run BEFORE cvmfs_client and nix_union_store
# (playbooks/publisher.yml): packages -> secrets -> publisher user -> local DNS
# cache -> repository (mkfs once) -> master-key guard -> server.conf -> show
# the public key. On the Publisher, cvmfs_client uses the key mkfs left here
# (cvmfs_public_key_from_host), so mkfs has to come before the client mount;
# on a re-run every step here is a no-op.

- name: Install the cernvm release package
  become: true
  ansible.builtin.apt:
    deb: "{{ cvmfs_release_deb }}"

- name: Install the server tools
  become: true
  ansible.builtin.apt:
    # No apache2: with an S3 upstream, mkfs, publish and the mount work without
    # it (spike S3), and it would hold port 80 if the Cache shares the host.
    # acl: Ansible needs setfacl to become publisher_user (the clone in
    # tasks/publishing); without it the run fails at "Clone this repo"
    # with "chmod: invalid mode: 'A+user:publisher:rx:allow'" (task #220).
    name: [acl, cvmfs, cvmfs-server, git, sqlite3]
    state: present
    update_cache: true

- name: Publisher secrets
  ansible.builtin.import_tasks: secrets.yml

- name: Publisher user
  become: true
  ansible.builtin.user:
    name: "{{ publisher_user }}"
    home: "{{ publisher_home }}"
    shell: /bin/bash
    create_home: true


# Local DNS cache before anything talks to the Origin: a publish looks up
# minio.hayweb.org once per S3 request, and the LAN resolvers answer REFUSED
# once a client passes their per-client rate limit (spike S3, "Open: the
# resolver refuses the Publisher"). systemd-resolved caches for the record's
# TTL (300 s / 3600 s today) and forwards to the same upstreams.
# Config first, so the daemon starts with the right upstreams when the
# package's postinst points /etc/resolv.conf at the stub.
- name: Local DNS cache config dir
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Local DNS cache config
  become: true
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/cvmfs-publisher.conf
    mode: "0644"
  notify: Restart systemd-resolved

- name: Install the local DNS cache
  become: true
  ansible.builtin.apt:
    name: [systemd-resolved, bind9-dnsutils]
    state: present

- name: Local DNS cache on
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved.service
    enabled: true
    state: started

- name: Resolv.conf points at the local stub
  become: true
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/stub-resolv.conf
    state: link
    force: true

- name: Apply the local DNS cache config
  ansible.builtin.meta: flush_handlers

- name: Verify the local DNS cache answers for the Origin
  ansible.builtin.command: "dig +short +time=2 +tries=1 {{ publisher_dns_probe }} @127.0.0.53"
  register: _dns_probe
  changed_when: false
  failed_when: >-
    _dns_probe.rc != 0 or
    (_dns_probe.stdout_lines | select('match', '^[0-9.]+$') | list | length == 0)

# Readable by the repository owner: mkfs -o and every later transaction run
# the S3 uploader as publisher_user, which otherwise sees no CVMFS_S3_HOST
# ("Failed to parse CVMFS_S3_HOST", template 7 task #217).
- name: S3 backend config
  become: true
  ansible.builtin.template:
    src: s3.conf.j2
    dest: /etc/cvmfs/s3.conf
    owner: root
    group: "{{ publisher_user }}"
    mode: "0640"
  no_log: true

- name: Create the repository (once; never re-run against a populated bucket)
  become: true
  ansible.builtin.command: >
    cvmfs_server mkfs -s /etc/cvmfs/s3.conf -w {{ cvmfs_stratum0_url }}
    -o {{ publisher_user }} {{ cvmfs_repository }}
  args:
    creates: "/etc/cvmfs/repositories.d/{{ cvmfs_repository }}"
  register: _mkfs

- name: Master key guard
  ansible.builtin.import_tasks: masterkey_guard.yml

- name: Repository TTL
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/cvmfs/repositories.d/{{ cvmfs_repository }}/server.conf"
    regexp: "^CVMFS_REPOSITORY_TTL="
    line: "CVMFS_REPOSITORY_TTL={{ cvmfs_repository_ttl }}"

- name: Explicit nested catalogs only
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/cvmfs/repositories.d/{{ cvmfs_repository }}/server.conf"
    regexp: "^CVMFS_AUTOCATALOGS="
    line: "CVMFS_AUTOCATALOGS=false"

- name: Public key (show it; copy it to the control node if asked)
  ansible.builtin.import_tasks: public_key.yml
