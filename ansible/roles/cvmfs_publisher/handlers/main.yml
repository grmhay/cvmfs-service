---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart nix-daemon
  become: true
  ansible.builtin.systemd:
    name: nix-daemon.service
    state: restarted

- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: restarted
