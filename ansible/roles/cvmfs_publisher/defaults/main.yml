---
# cvmfs_publisher: the Stratum 0 (Debian 13 x86_64 VM). Owns the Repository,
# builds Profiles (aarch64 on pi5/pi6), publishes to the Origin on a timer.
cvmfs_repository: nix.hayweb.org
publisher_user: publisher
publisher_home: /home/publisher
# Public repo, read-only clone: HTTPS needs no deploy key (nothing on the Publisher pushes).
publisher_repo_url: https://github.com/grmhay/cvmfs-service.git
publisher_repo_dir: "{{ publisher_home }}/cvmfs-service"
publisher_state_dir: "{{ publisher_home }}/.local/state/cvmfs-publish"
publisher_interval: 5min
publisher_timer_enabled: false    # enable after the first manual publish succeeds
# Relative to the role, so it resolves inside a vendored collection as well as
# a checkout (ansible/secrets/ ships with every tag; ADR 0005).
publisher_secrets_file: "{{ role_path }}/../../secrets/publisher.enc.yaml"
# The control user's age key at its conventional place. Taken from the passwd
# entry, not $HOME, which Semaphore sets per template. An exported
# SOPS_AGE_KEY_FILE wins.
sops_age_key_file: >-
  {{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE')
     or ('~' ~ lookup('ansible.builtin.pipe', 'id -un') ~ '/.config/sops/age/keys.txt') | expanduser }}

# mkfs -w: where the Publisher reads its own repository back (CVMFS_STRATUM0;
# cvmfs_server appends /<repository>). The bucket itself, never the Cache: a
# cached .cvmfsreflog or .cvmfspublished from seconds earlier fails the commit
# with "data corruption in .cvmfsreflog" (spike S3). Clients set their own URL
# (cvmfs_client: CVMFS_SERVER_URL -> cache1).
cvmfs_stratum0_url: "https://{{ cvmfs_s3_host }}/{{ cvmfs_s3_bucket }}"
cvmfs_s3_host: "minio.hayweb.org:9000"   # S3 API port (confirmed in S1; the console is 9002)
cvmfs_s3_bucket: cvmfs
cvmfs_repository_ttl: 240                # seconds; default (Q16)

# Local DNS cache (systemd-resolved, stub on 127.0.0.53): the LAN resolvers
# REFUSE a client that passes their per-client rate limit, and a publish looks
# up the Origin once per S3 request (spike S3). Empty upstreams: use the
# per-link servers DHCP hands to systemd-networkd instead (under ifupdown, set
# them here: resolved does not learn dhclient's servers).
publisher_dns_upstreams: [192.168.40.17, 192.168.50.17]
publisher_dns_domains: [hayweb.org]      # search domains: pi5/pi6 are short names
publisher_dns_probe: "{{ cvmfs_s3_host.split(':') | first }}"   # verify lookup: the Origin

nix_remote_builders:
  - { host: pi5, system: aarch64-linux, max_jobs: 4, speed: 1 }
  - { host: pi6, system: aarch64-linux, max_jobs: 4, speed: 1 }
nix_builder_user: nixbuild

cvmfs_release_deb: https://ecsft.cern.ch/dist/cvmfs/cvmfs-release/cvmfs-release-latest_all.deb

# Optional: also copy the Repository public key to this path on the control
# node after mkfs (tasks/public_key.yml). Empty: the run only prints it. Name a
# path you will commit from, never a file inside the vendored collection: a
# re-vendor wipes it (#17, docs/runbooks/publisher-bootstrap.md).
publisher_public_key_fetch_dest: ""

# The master key may be on the Publisher only during a resign. mkfs leaves it
# here; publish/masterkey-escrow.sh moves it into ansible/secrets/masterkey.enc.yaml.
# Any run after the first fails while it is present, unless this is true
# (tasks/masterkey_guard.yml, docs/runbooks/publisher-bootstrap.md).
publisher_masterkey_path: "/etc/cvmfs/keys/{{ cvmfs_repository }}.masterkey"
publisher_allow_masterkey: false
