---
- name: Install nginx
  become: true
  ansible.builtin.package:
    name: nginx
    state: present

- name: Cache directory
  become: true
  ansible.builtin.file:
    path: "{{ cache_path }}"
    state: directory
    owner: "{{ 'www-data' if ansible_os_family == 'Debian' else 'nginx' }}"
    mode: "0750"

- name: Shared upstream settings
  become: true
  ansible.builtin.template:
    src: cvmfs-upstream.inc.j2
    dest: /etc/nginx/cvmfs-upstream.inc
    mode: "0644"
  notify: Reload nginx

- name: Site config
  become: true
  ansible.builtin.template:
    src: cvmfs-cache.conf.j2
    dest: "{{ '/etc/nginx/sites-available/cvmfs-cache.conf' if ansible_os_family == 'Debian' else '/etc/nginx/conf.d/cvmfs-cache.conf' }}"
    mode: "0644"
  notify: Reload nginx

- name: Enable the site (Debian)
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/cvmfs-cache.conf
    dest: /etc/nginx/sites-enabled/cvmfs-cache.conf
    state: link
  when: ansible_os_family == "Debian"
  notify: Reload nginx

- name: Drop the default site (Debian)
  become: true
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: ansible_os_family == "Debian"
  notify: Reload nginx

# nginx resolves the Origin's name when it starts. At boot that lookup can lose the race with the
# network (#89) and the config test fails. Keep retrying until it resolves; at 10s the default
# start limit (5 in 10s) is never hit.
- name: Drop-in directory for nginx
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: "0755"

- name: Restart nginx on failure
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/cvmfs-restart.conf
    mode: "0644"
    content: |
      # Managed by cvmfs-service (#89).
      [Service]
      Restart=on-failure
      RestartSec=10s

- name: Start nginx
  become: true
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
