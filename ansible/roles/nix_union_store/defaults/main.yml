---
# nix_union_store: Nix daemon on every host, with /nix/store assembled from a
# local RW branch and the Repository's read-only Lower Store (ADR 0002).
#
#   union  — mergerfs(/nix/.rw-store/store=RW : /cvmfs/<repo>/nix/store=RO),
#            Nix local-overlay-store over it. Zero-copy; publish is instantly visible.
#   cache  — plain local /nix; Binary Cache in the Repository as a substituter;
#            fleet-profile.timer copies the Group Profile in. The fallback.
#   thin   — no daemon; /nix/store is a read-only bind of the Lower Store.
cvmfs_nix_mode: union

cvmfs_repository: nix.hayweb.org

# From NetBox (custom fields nix_group / nix_channel) via the dynamic inventory.
nix_group: base
nix_channel: stable

# Determinate installer, pinned (Q11). Bumping the pin upgrades the fleet: a
# host whose Nix differs from the one the pinned installer installs is moved to
# it in place on the next run (tasks/upgrade.yml), then its daemon restarts; a
# host already on it is not touched. After a bump, recheck nix_overlay_store_url
# against `nix help-stores` for the new Nix.
#
# Each installer release installs one upstream Nix, fixed in its flake.nix and
# embedded in the binary (the role reads it from there): v3.8.0 -> 2.30.0,
# v3.11.3 -> 2.32.0, v3.17.0 -> 2.34.0, v3.23.1 -> 2.35.2. From v3.13.0 the
# installer defaults to Determinate Nix, so the role asks for upstream Nix with
# NIX_INSTALLER_PREFER_UPSTREAM_NIX (older releases ignore it).
#
# Upgrade method: `nix upgrade-nix`, pinned to the release's fallback-paths.nix
# on releases.nixos.org. The installer has no upgrade command for upstream Nix:
# v3.8.0's README documents `sudo -i nix upgrade-nix` for upstream installs and
# `determinate-nixd upgrade` for Determinate Nix; later READMEs keep only the
# latter. Their other route, uninstall and reinstall with another installer,
# deletes /nix, RW Branch included, and a re-run of `install` on an installed
# host refuses. upgrade-nix fetches through the daemon and only switches the
# default profile, so the Union Store is left as it is. Without the explicit
# URL it would follow the installer's upgrade-nix-store-path-url (Determinate's
# moving "stable"), not the pin.
nix_installer_version: "3.8.0"
nix_installer_url: "https://install.determinate.systems/nix/tag/v{{ nix_installer_version }}"

nix_rw_root: /nix/.rw-store

# The Lower Store: a Nix store's /nix directory (store/ + var/nix/db), the RO
# branch of the Union Store. Production is always the Repository's; a stand-in
# directory lets the role run on a host with no Repository (spikes/union-standin.sh).
nix_lower_store: "/cvmfs/{{ cvmfs_repository }}/nix"

# A store path the daemon must report valid at the end of a union run. Only the
# Lower Store has it, so it is valid only through the overlay. Defaults to the
# host's published Group Profile; empty skips the check (no Repository in use).
nix_union_check_path: "/cvmfs/{{ cvmfs_repository }}/profiles/{{ nix_channel }}/{{ nix_group }}/{{ nix_system }}"

# The store nix-daemon serves in union mode (clients use store = daemon).
# Lower Store: the Repository's /nix (store + db.sqlite), read-only — the
# Publisher leaves db.sqlite checkpointed, out of WAL mode, because a read-only
# store opens it immutable and ignores a -wal file (spike S2). Upper layer: the
# mergerfs RW branch. check-mount=false because the merged mount is mergerfs,
# not overlayfs (ADR 0002). No root=/: it makes the real store dir "//nix/store",
# which Nix takes for a chroot store and redirects every build output (spike S2). Verify the URL grammar against `nix help-stores`
# whenever nix_installer_version is bumped.
nix_overlay_store_url: "local-overlay://?lower-store=local%3Froot%3D{{ nix_lower_store | dirname | urlencode | replace('/', '%2F') }}%26read-only%3Dtrue&upper-layer={{ nix_rw_root }}/store&check-mount=false"

# Nix's build sandbox cannot work on the union: the chroot is created under the
# store as <drv>.chroot (0700) and mergerfs resolves paths as the build user
# (spike S2, ADR 0002). Until upstream fixes the mode, one of:
#   "false"  — no sandbox, build users kept (default)
#   "root"   — sandbox kept, no build users: builds run as root inside it
#   "true"   — sandbox on; local builds on union hosts fail until the upstream fix
nix_union_sandbox: "false"

nix_gc_older_than: 30d
nix_min_free: 2G
nix_max_free: 10G

# mergerfs option set — final values come out of spike S2.
#   category.create=ff     writes go to the first (RW) branch
#   inodecalc=path-hash    stable inodes regardless of CVMFS renumbering per revision
#   cache.files=auto-full  page cache on: executables are mmapped
#   cache.negative_entry=0 a path published after a failed lookup is found next time
#   cache.entry=1          1 s dentry cache; a revision flip is visible within it
#   branches-mount-timeout wait for /cvmfs to be there at boot
mergerfs_options: "category.create=ff,inodecalc=path-hash,cache.files=auto-full,cache.negative_entry=0,cache.entry=1,cache.attr=1,allow_other,branches-mount-timeout=60,fsname=nixstore"

# RHEL 10 has no distro package; upstream publishes RPMs per release (spike S1
# confirms el10.aarch64). Debian 13 ships 2.40.2 natively.
mergerfs_version: "2.40.2"
mergerfs_rpm_url: "https://github.com/trapexit/mergerfs/releases/download/{{ mergerfs_version }}/mergerfs-{{ mergerfs_version }}-1.el10.{{ ansible_architecture }}.rpm"
