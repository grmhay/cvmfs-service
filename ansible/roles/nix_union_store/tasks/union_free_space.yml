---
# The RW Branch's free-space floor (#81): nix_union_minfreespace, which
# mergerfs_options passes to every new mount of the union, with statfs_ignore=ro
# so that the union's free space, which Nix's min-free reads, is the RW Branch's.
#
# tests/union-free-space.sh runs this file against a scratch mergerfs.

# Below the floor mergerfs stops writes; below nix_min_free Nix collects
# garbage. Nix must get there first, or its GC never runs on a full RW Branch.
- name: The union's free-space floor is under Nix's min-free
  ansible.builtin.assert:
    that: >-
      (nix_union_minfreespace | ansible.builtin.human_to_bytes)
      < (nix_min_free | ansible.builtin.human_to_bytes)
    fail_msg: >-
      nix_union_minfreespace ({{ nix_union_minfreespace }}) must be under nix_min_free
      ({{ nix_min_free }}): at or above it, mergerfs stops writes to /nix/store
      ("Read-only file system") before Nix's GC ever runs (#81).
    quiet: true

# A mounted union keeps the options it was mounted with: a new unit file, a
# daemon reload and `state: started` leave it as it is (see union.yml). So a
# union mounted before #81, on mergerfs's own 4 GiB floor and counting every
# branch's free space, gets the role's settings through its control file,
# live: no remount, the daemon keeps running. mergerfs reads minfreespace back
# in bytes. No control file: no union mounted yet, and its first mount takes
# both from the unit. In check mode it reads, and reports what it would set.
- name: Set the mounted union's free-space floor and free-space reporting
  become: true
  check_mode: false
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"
      - -c
      - |
        import os, sys
        path, dry, settings = sys.argv[1], sys.argv[2] == "True", sys.argv[3:]
        if not os.path.exists(path):
            print("no union")
            sys.exit()
        changed = False
        for setting in settings:
            name, want = setting.split("=", 1)
            key = "user.mergerfs." + name
            if os.getxattr(path, key).decode() != want:
                changed = True
                if not dry:
                    os.setxattr(path, key, want.encode())
        print("changed" if changed else "unchanged")
      - "{{ nix_union_control_file }}"
      - "{{ ansible_check_mode }}"
      - "minfreespace={{ nix_union_minfreespace | ansible.builtin.human_to_bytes }}"
      - statfs_ignore=ro
  register: _union_floor
  changed_when: _union_floor.stdout == "changed"
