---
# Thin mode: no daemon. /nix/store is a read-only bind of the Lower Store;
# binaries run straight from it. For hosts that cannot run mergerfs.

# leave_union.yml has removed the daemon's unit files and links, which
# systemctl refuses to mask over. Masking works on a unit that was never
# installed, so a failure here is real. A mask outranks being enabled.
- name: Mask the daemon
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - nix-daemon.socket
    - nix-daemon.service

# Masked, the units are known to systemd even on a host that never had Nix.
- name: Stop the daemon
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  loop:
    - nix-daemon.socket
    - nix-daemon.service

- name: Bind the Lower Store read-only onto /nix/store
  become: true
  ansible.posix.mount:
    src: "{{ cvmfs_client_mountpoint }}/nix/store"
    path: /nix/store
    fstype: none
    opts: bind,ro,_netdev,x-systemd.requires-mounts-for={{ cvmfs_client_mountpoint }}
    state: mounted
