---
# Assemble /nix/store as a mergerfs union. The Determinate installer created a
# plain /nix/store on the root filesystem; on first run its contents move to
# the RW branch so nothing already installed is lost.

- name: Is /nix/store already a mergerfs mount?
  ansible.builtin.command: findmnt -n -o FSTYPE /nix/store
  register: _store_fstype
  changed_when: false
  failed_when: false

- name: Migrate the installer's /nix/store to the RW branch (first run only)
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl stop nix-daemon.socket nix-daemon.service || true
    mkdir -p {{ nix_rw_root }}
    mv /nix/store {{ nix_rw_root }}/store
    mkdir -p /nix/store
  args:
    creates: "{{ nix_rw_root }}/store"
    executable: /bin/bash
  when: _store_fstype.stdout != "fuse.mergerfs"

- name: Install the nix-store.mount unit
  become: true
  ansible.builtin.template:
    src: nix-store.mount.j2
    dest: /etc/systemd/system/nix-store.mount
    mode: "0644"
  notify: Reload systemd

# A union already mounted on other branches (a Canary over the stand-in Lower
# Store, #28) keeps them until it is remounted: a new unit file, a daemon
# reload and `state: started` all leave a mounted mount as it is. The daemon's
# drop-in below would then open the Repository's database over the stand-in's
# files. mergerfs reports its live branches in an xattr on its control file.
- name: Read the mounted union's branches
  become: true
  ansible.builtin.command: >-
    {{ ansible_facts.python.executable }} -c 'import os;
    print(os.getxattr("/nix/store/.mergerfs", "user.mergerfs.branches").decode())'
  register: _union_branches
  changed_when: false
  when: _store_fstype.stdout == "fuse.mergerfs"

- name: Remount the union on the Lower Store
  when: >-
    _union_branches is not skipped
    and _union_branches.stdout != nix_rw_root ~ '/store=RW:' ~ nix_lower_store ~ '/store=RO'
  become: true
  block:
    - name: Stop nix-daemon before the remount
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - nix-daemon.socket
        - nix-daemon.service

    - name: Remount /nix/store on the Lower Store
      ansible.builtin.systemd:
        name: nix-store.mount
        state: restarted
        daemon_reload: true
  rescue:
    - name: Start nix-daemon again on the old union
      ansible.builtin.systemd:
        name: nix-daemon.socket
        state: started

    - name: The union could not be remounted
      ansible.builtin.fail:
        msg: >-
          /nix/store is mounted on {{ _union_branches.stdout }}, not on {{ nix_lower_store }}/store,
          and remounting it failed (most likely a process still uses /nix/store: fuser -vm
          /nix/store). Stop those processes, or reboot, then re-run.

- name: Ensure the drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/nix-daemon.service.d
    state: directory
    mode: "0755"

# The daemon alone opens the overlay store; nix.conf points clients at it
# with store = daemon. % is doubled for systemd.
- name: Run nix-daemon on the overlay store, after the union mount
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/nix-daemon.service.d/union-store.conf
    mode: "0644"
    content: |
      [Unit]
      Requires=nix-store.mount
      After=nix-store.mount

      [Service]
      ExecStart=
      ExecStart=@/nix/var/nix/profiles/default/bin/nix-daemon nix-daemon --daemon --option store {{ nix_overlay_store_url | replace('%', '%%') }}
  notify:
    - Reload systemd
    - Restart nix-daemon

- name: Boot ordering of the union and the daemon
  ansible.builtin.include_tasks: boot_order.yml

- name: Mount the union store
  become: true
  ansible.builtin.systemd:
    name: nix-store.mount
    enabled: true
    state: started
    daemon_reload: true

# The daemon's units are the role's own files (boot_order.yml), and
# daemon_reload has systemd load them now. The socket comes up before the handlers
# restart the service; a service started first makes the socket refuse to listen.
- name: Start the daemon's socket on top of it
  become: true
  ansible.builtin.systemd:
    name: nix-daemon.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so the daemon restarts on the union
  ansible.builtin.meta: flush_handlers

- name: Look for the check path
  ansible.builtin.stat:
    path: "{{ nix_union_check_path }}"
  register: _check_path
  when: nix_union_check_path | length > 0

# The Group Profile is missing until it is published for this system on this
# Channel: stable fills only on promote, so a bootstrap run lands here. Any
# published Profile lives only in the Lower Store too, so check one of those.
- name: Find another published Profile when the check path is missing
  ansible.builtin.command: >-
    find {{ cvmfs_client_mountpoint }}/profiles -mindepth 3 -maxdepth 3 -type l -print -quit
  register: _any_profile
  changed_when: false
  when: nix_union_check_path | length > 0 and not _check_path.stat.exists

- name: Some Profile is published
  ansible.builtin.assert:
    that: _any_profile.stdout | length > 0
    fail_msg: >-
      Neither {{ nix_union_check_path }} nor any other Profile under
      {{ cvmfs_client_mountpoint }}/profiles exists, so nothing can show the overlay serves the
      Lower Store. Publish first (docs/runbooks/publisher-bootstrap.md, step 4).
    quiet: true
  when: _any_profile is not skipped

- name: Note that this host's Group Profile is not published yet
  ansible.builtin.debug:
    msg: >-
      {{ nix_union_check_path }} is not published yet (promote fills stable); checked
      {{ _any_profile.stdout }} instead. If it is this host's PATH target, the PATH check
      (tasks/path_target.yml) fails the run.
  when: _any_profile is not skipped

# A path that exists only in the Lower Store is valid only through the overlay.
- name: The daemon serves the Lower Store through the overlay
  ansible.builtin.command: >-
    nix path-info --store daemon
    {{ _any_profile.stdout if _any_profile is not skipped else nix_union_check_path }}
  changed_when: false
  when: nix_union_check_path | length > 0
