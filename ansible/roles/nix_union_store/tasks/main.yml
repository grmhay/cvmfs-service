---
- name: Map the machine architecture to a Nix system
  ansible.builtin.set_fact:
    nix_system: "{{ {'x86_64': 'x86_64-linux', 'aarch64': 'aarch64-linux'}[ansible_architecture] }}"

# Inventory may give a YAML boolean (unquoted false/true/no/yes) or any case.
# Every later decision (the gate, nix.conf, the smoke build) reads this one.
- name: Normalise nix_union_sandbox
  ansible.builtin.set_fact:
    _nix_union_sandbox: "{{ nix_union_sandbox | string | lower }}"

- name: Check nix_union_sandbox is "false", "root" or "true"
  ansible.builtin.assert:
    that: _nix_union_sandbox in ["false", "root", "true"]
    fail_msg: >-
      nix_union_sandbox is {{ nix_union_sandbox | to_json }}; it must be "false", "root" or "true".
    quiet: true

# The Debian 13 template ships without curl (spike S1).
- name: Install curl for the Nix installer
  become: true
  ansible.builtin.package:
    name: curl
    state: present
  when: cvmfs_nix_mode != "thin"

- name: Look for the Nix installer's receipt
  ansible.builtin.stat:
    path: /nix/receipt.json
  register: _nix_receipt
  when: cvmfs_nix_mode != "thin"

# The installer refuses a host that already has a Nix it did not install
# (e.g. Debian's nix-bin), and the role must not remove one by itself.
- name: Find a Nix the pinned installer did not install
  ansible.builtin.shell: |
    set -o pipefail
    nix=$(command -v nix || command -v nix-env || true)
    [ -n "$nix" ] || exit 0
    real=$(readlink -f "$nix")
    echo "$real ($(dpkg -S "$real" 2>/dev/null | cut -d: -f1 || rpm -qf "$real" 2>/dev/null || echo 'no package'))"
  args:
    executable: /bin/bash
  register: _foreign_nix
  changed_when: false
  when: cvmfs_nix_mode != "thin" and not _nix_receipt.stat.exists

- name: No Nix from another source
  ansible.builtin.assert:
    that: _foreign_nix.stdout | length == 0
    fail_msg: >-
      {{ inventory_hostname }} already has a Nix the pinned installer did not install:
      {{ _foreign_nix.stdout }}. The Union Store needs the installer's multi-user Nix.
      Remove the other one by hand first, keeping its store aside rather than deleting it.
      On Debian: sudo apt purge nix-bin nix-setup-systemd, then sudo mv /nix /nix.distro and
      sudo mv /etc/nix /etc/nix.distro. Then re-run.
    quiet: true
  when: _foreign_nix is not skipped

- name: Install Nix (Determinate, pinned) if missing
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "{{ nix_installer_url }}" | sh -s -- install linux --no-confirm --init systemd
  args:
    creates: /nix/receipt.json
    executable: /bin/bash
  environment:
    # Installers from v3.13.0 default to Determinate Nix; v3.8.0 ignores this.
    NIX_INSTALLER_PREFER_UPSTREAM_NIX: "true"
  when: cvmfs_nix_mode != "thin"

- name: Read the installed Nix version
  ansible.builtin.include_tasks: nix_version.yml
  when: cvmfs_nix_mode != "thin"

- name: Upgrade Nix when the installer pin moves
  ansible.builtin.include_tasks: upgrade.yml
  when: cvmfs_nix_mode != "thin"

- name: Sandbox version gate
  ansible.builtin.include_tasks: sandbox_gate.yml
  when: cvmfs_nix_mode == "union" and _nix_union_sandbox == "true"

# -- thin and cache modes need no mergerfs; union does.
- name: Install mergerfs (Debian)
  become: true
  ansible.builtin.package:
    name: mergerfs
    state: present
  when: cvmfs_nix_mode == "union" and ansible_os_family == "Debian"

- name: Install mergerfs (RedHat, upstream RPM)
  become: true
  ansible.builtin.dnf:
    name: "{{ mergerfs_rpm_url }}"
    disable_gpg_check: true
    state: present
  when: cvmfs_nix_mode == "union" and ansible_os_family == "RedHat"

- name: Write nix.conf
  become: true
  ansible.builtin.template:
    src: nix.conf.j2
    dest: /etc/nix/nix.conf
    mode: "0644"
  notify: Restart nix-daemon

# Before any union step: on the Publisher before the first publish there is no
# Lower Store yet, and the union waits for it (#16); anywhere else that fails.
- name: Lower Store present (or the Publisher's first run)
  ansible.builtin.include_tasks: lower_store.yml
  when: cvmfs_nix_mode == "union"

- name: Union-store assembly
  ansible.builtin.include_tasks: union.yml
  when: cvmfs_nix_mode == "union" and not (_nix_union_deferred | default(false))

- name: Cache-mode profile puller
  ansible.builtin.include_tasks: cache.yml
  when: cvmfs_nix_mode == "cache"

- name: Thin-mode bind mount
  ansible.builtin.include_tasks: thin.yml
  when: cvmfs_nix_mode == "thin"

- name: Put the Group Profile on PATH
  become: true
  ansible.builtin.template:
    src: cvmfs-nix.sh.j2
    dest: /etc/profile.d/cvmfs-nix.sh
    mode: "0644"

- name: Weekly GC of the local branch
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - nix-gc.service
    - nix-gc.timer
  when: cvmfs_nix_mode != "thin"
  notify: Reload systemd

- name: Enable the GC timer
  become: true
  ansible.builtin.systemd:
    name: nix-gc.timer
    enabled: true
    state: started
    daemon_reload: true
  when: cvmfs_nix_mode != "thin"

# Last step: a broken sandbox fails the play, not someone's build later (#6).
- name: Sandboxed smoke build
  ansible.builtin.include_tasks: smoke.yml
  when: >-
    cvmfs_nix_mode == "union" and _nix_union_sandbox in ["true", "root"]
    and not (_nix_union_deferred | default(false))
