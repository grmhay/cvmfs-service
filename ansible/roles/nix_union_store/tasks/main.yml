---
- name: Map the machine architecture to a Nix system
  ansible.builtin.set_fact:
    nix_system: "{{ {'x86_64': 'x86_64-linux', 'aarch64': 'aarch64-linux'}[ansible_architecture] }}"

# The Debian 13 template ships without curl (spike S1).
- name: Install curl for the Nix installer
  become: true
  ansible.builtin.package:
    name: curl
    state: present
  when: cvmfs_nix_mode != "thin"

- name: Install Nix (Determinate, pinned) if missing
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "{{ nix_installer_url }}" | sh -s -- install linux --no-confirm --init systemd
  args:
    creates: /nix/receipt.json
    executable: /bin/bash
  environment:
    # Installers from v3.13.0 default to Determinate Nix; v3.8.0 ignores this.
    NIX_INSTALLER_PREFER_UPSTREAM_NIX: "true"
  when: cvmfs_nix_mode != "thin"

- name: Upgrade Nix when the installer pin moves
  ansible.builtin.include_tasks: upgrade.yml
  when: cvmfs_nix_mode != "thin"

- name: Sandbox version gate
  ansible.builtin.include_tasks: sandbox_gate.yml
  when: cvmfs_nix_mode == "union" and (nix_union_sandbox | string | lower) == "true"

# -- thin and cache modes need no mergerfs; union does.
- name: Install mergerfs (Debian)
  become: true
  ansible.builtin.package:
    name: mergerfs
    state: present
  when: cvmfs_nix_mode == "union" and ansible_os_family == "Debian"

- name: Install mergerfs (RedHat, upstream RPM)
  become: true
  ansible.builtin.dnf:
    name: "{{ mergerfs_rpm_url }}"
    disable_gpg_check: true
    state: present
  when: cvmfs_nix_mode == "union" and ansible_os_family == "RedHat"

- name: Write nix.conf
  become: true
  ansible.builtin.template:
    src: nix.conf.j2
    dest: /etc/nix/nix.conf
    mode: "0644"
  notify: Restart nix-daemon

- name: Union-store assembly
  ansible.builtin.include_tasks: union.yml
  when: cvmfs_nix_mode == "union"

- name: Cache-mode profile puller
  ansible.builtin.include_tasks: cache.yml
  when: cvmfs_nix_mode == "cache"

- name: Thin-mode bind mount
  ansible.builtin.include_tasks: thin.yml
  when: cvmfs_nix_mode == "thin"

- name: Put the Group Profile on PATH
  become: true
  ansible.builtin.template:
    src: cvmfs-nix.sh.j2
    dest: /etc/profile.d/cvmfs-nix.sh
    mode: "0644"

- name: Weekly GC of the local branch
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - nix-gc.service
    - nix-gc.timer
  when: cvmfs_nix_mode != "thin"
  notify: Reload systemd

- name: Enable the GC timer
  become: true
  ansible.builtin.systemd:
    name: nix-gc.timer
    enabled: true
    state: started
    daemon_reload: true
  when: cvmfs_nix_mode != "thin"

# Last step: a broken sandbox fails the play, not someone's build later (#6).
- name: Sandboxed smoke build
  ansible.builtin.include_tasks: smoke.yml
  when: cvmfs_nix_mode == "union" and nix_union_sandbox in ["true", "root"]
