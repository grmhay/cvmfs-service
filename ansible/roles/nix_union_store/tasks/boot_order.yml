---
# Union Mode: what makes the union and the daemon come up on their own at
# boot (#35). tests/union-mount-order.sh boots these units in systemd's test
# mode, on the Publisher's unit set and on a stand-in Canary's.
#
# nix-store.mount is a network mount, in remote-fs.target: it waits for the
# network and the client view, which come up after local-fs.target.
#
# The installer links nix-daemon.service and .socket from the default profile,
# that is from /nix/store. With the union, /nix/store is an empty mountpoint
# when systemd loads units at boot, so neither loads and the daemon stays down
# until someone starts it. The role's own copies are plain files.

- name: Install the daemon's units as files, not links into /nix/store
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    follow: false
  loop:
    - nix-daemon.service
    - nix-daemon.socket
  notify: Reload systemd

# Links from the earlier [Install] sections: nix-store.mount was in
# multi-user.target, the installer's socket in sockets.target. The enable
# tasks in union.yml link them where their [Install] says now.
- name: Remove the old install links
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - multi-user.target.wants/nix-store.mount
    - sockets.target.wants/nix-daemon.socket

- name: Reload systemd onto the boot units
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Read the union's boot ordering
  become: true
  ansible.builtin.systemd:
    name: nix-store.mount
  register: _union_unit
  when: not ansible_check_mode

# A union before local-fs.target loops at boot with the network it waits for,
# and systemd breaks the loop by dropping a job: the union, or the network.
# Checked after the reload, before the union is (re)started on the new unit.
- name: The union is not ordered before local-fs.target
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: "'local-fs.target' not in _union_unit.status.Before.split()"
    fail_msg: >-
      nix-store.mount is ordered Before={{ _union_unit.status.Before }}, so the boot
      would loop with network-online.target (#35). It must be a network mount: DefaultDependencies=no,
      After=network-online.target, WantedBy=remote-fs.target (templates/nix-store.mount.j2).
    quiet: true
