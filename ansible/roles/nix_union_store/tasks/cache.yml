---
# Fallback mode: ordinary local /nix, the Repository's Binary Cache as a
# substituter, and a timer that installs the Group Profile from it.

- name: Install the fleet-profile puller
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - fleet-profile.service
    - fleet-profile.timer
  register: _puller_units
  notify: Reload systemd

# Restarted when its units change: a running timer keeps the schedule it
# started with, and OnActiveSec (the first pull) counts from its start.
- name: Enable the puller
  become: true
  ansible.builtin.systemd:
    name: fleet-profile.timer
    enabled: true
    state: "{{ 'restarted' if _puller_units is changed else 'started' }}"
    daemon_reload: true
