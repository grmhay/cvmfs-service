---
# Sets _nix_installed_version: the Nix the default profile runs. Read-only, so
# it also runs under --check. Included before the upgrade and again after one;
# the upgrade and the sandbox gate both read this fact.

- name: Read the installed Nix version
  ansible.builtin.command: /nix/var/nix/profiles/default/bin/nix --version
  register: _nix_version_out
  changed_when: false
  check_mode: false

# Upstream prints "nix (Nix) X.Y.Z"; Determinate prints
# "nix (Determinate Nix X.Y.Z) A.B.C". The Nix version is the last one.
- name: Parse the installed Nix version
  ansible.builtin.set_fact:
    _nix_installed_version: "{{ _nix_version_out.stdout | regex_findall('[0-9]+\\.[0-9]+\\.[0-9]+') | last }}"
