---
# Assumes nix_union_store already ran (Nix installed, daemon up).

- name: Create the build user
  become: true
  ansible.builtin.user:
    name: "{{ nix_builder_user }}"
    shell: /bin/bash
    create_home: true

- name: Authorise the Publisher's key
  become: true
  ansible.posix.authorized_key:
    user: "{{ nix_builder_user }}"
    key: "{{ nix_builder_authorized_key }}"
    key_options: 'restrict,command="/nix/var/nix/profiles/default/bin/nix-store --serve --write"'
  when: nix_builder_authorized_key | length > 0

# nix_union_store owns nix.conf and includes this drop-in; editing nix.conf
# itself would undo that role's template on every run, and the restart with it.
- name: Nix drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/nix/nix.conf.d
    state: directory
    mode: "0755"

- name: Trust the build user and set job slots (nix.conf drop-in)
  become: true
  ansible.builtin.copy:
    dest: /etc/nix/nix.conf.d/nix_builder.conf
    mode: "0644"
    content: |
      # Managed by cvmfs-service (role nix_builder), included by nix.conf.
      max-jobs = {{ nix_builder_max_jobs }}
      extra-trusted-users = {{ nix_builder_user }}
  notify: Restart nix-daemon
