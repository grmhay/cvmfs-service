---
# Assumes nix_union_store already ran (Nix installed, daemon up).

- name: Create the build user
  become: true
  ansible.builtin.user:
    name: "{{ nix_builder_user }}"
    shell: /bin/bash
    create_home: true

- name: Authorise the Publisher's key
  become: true
  ansible.posix.authorized_key:
    user: "{{ nix_builder_user }}"
    key: "{{ nix_builder_authorized_key }}"
    key_options: 'restrict,command="/nix/var/nix/profiles/default/bin/nix-store --serve --write"'
  when: nix_builder_authorized_key | length > 0

- name: Trust the build user and set job slots
  become: true
  ansible.builtin.blockinfile:
    path: /etc/nix/nix.conf
    marker: "# {mark} nix_builder"
    block: |
      max-jobs = {{ nix_builder_max_jobs }}
      trusted-users = root @wheel {{ nix_builder_user }}
  notify: Restart nix-daemon
