---
# cvmfs_client: install the CernVM-FS client and statically mount the Repository.
cvmfs_repository: nix.hayweb.org

# Where this host mounts its client view of the Repository: the CVMFS default
# for every fleet host. publisher.yml moves it on the Publisher, where
# cvmfs_server owns /cvmfs/<repo> (#15, ADR 0004). A playbook property, not a
# host fact. nix_union_store reads the same variable.
cvmfs_client_mountpoint: "/cvmfs/{{ cvmfs_repository }}"

# Clients read through the Cache (nginx reverse cache), never the bucket.
# Several URLs = failover order. Cloud hosts use the same list over OpenVPN (Q5b).
cvmfs_server_urls:
  - "http://cache1.hayweb.org/cvmfs/@fqrn@"
cvmfs_http_proxy: DIRECT

# LRU cache quota in MB (Q17). Override per NetBox group:
#   Pis 10000, VMs 20000, cloud 20000, builders/publisher 50000.
cvmfs_quota_limit_mb: 20000
cvmfs_cache_base: /var/lib/cvmfs

# The Repository public key (not a secret): committed in cvmfs-service at
# ansible/roles/cvmfs_client/files/nix.hayweb.org.pub, so it ships inside the
# collection. A missing key fails the run early (tasks/public_key.yml); how it
# gets committed: docs/runbooks/publisher-bootstrap.md.
cvmfs_public_key_file: nix.hayweb.org.pub

# true only on the Publisher (publisher.yml): use the key mkfs left in
# /etc/cvmfs/keys there instead of shipping the committed one, and fail if the
# two differ. Lets the Publisher's first run work before the key is committed.
# A playbook property, not a host fact.
cvmfs_public_key_from_host: false

# Release packages (spike S1 confirms URLs; override if cernvm moves them).
cvmfs_release_deb: https://ecsft.cern.ch/dist/cvmfs/cvmfs-release/cvmfs-release-latest_all.deb
cvmfs_release_rpm: https://ecsft.cern.ch/dist/cvmfs/cvmfs-release/cvmfs-release-latest.noarch.rpm
